[package]
name = "rmp"
version = "0.2.0"
edition = "2024"
description = "RMP (Rust Media Player): a Rust-native multimedia toolkit, forked from FFmpReg."
authors = ["Yazalde Filimone <yazaldefilimon@gmail.com>"]
repository = "https://github.com/DrWattsMitch/RustMediaPlayer"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
libc = { version = "0.2", optional = true }
# AV1: the Rust port of dav1d (BSD-2-Clause). Its asm needs `nasm` on x86-64.
rav1d = { version = "1.1.0", optional = true, default-features = false, features = ["asm", "bitdepth_8", "bitdepth_16"] }
nom = "8.0.0"
reqwest = { version = "0.13.2", features = ["blocking", "default-tls"] }
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.139"

[dev-dependencies]
tempfile = "3.10"

[features]
default = ["av1"]
# AV1 decoding through rav1d (see src/codecs/av1).
av1 = ["dep:rav1d", "dep:libc"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols" # Set to `false` for debug information
debug = false # Set to `true` for debug information
panic = "abort" # Let it crash and force ourselves to write safe Rust

[profile.dev]
# Disabling debug info speeds up local and CI builds,
# and we don't rely on it for debugging that much.
debug = false

[profile.test]
# Disabling debug info speeds up local and CI builds,
# and we don't rely on it for debugging that much.
debug = false




# Profile used for release mode, but with debugging information for profiling
# and debugging. Use `cargo build --profile=release-with-debug` to build with this profile.
[profile.release-with-debug]
inherits = "release"
strip = false # Keep debug information in binary
debug = true # Include maximum amount of debug information

# Profile for `cargo coverage`
[profile.coverage]
inherits = "release"
opt-level = 2 # Compile faster
codegen-units = 256 # Compile faster
lto = "thin" # Faster compile time with thin LTO
debug-assertions = true # Make sure `debug_assert!`s pass
overflow-checks = true # Catch arithmetic overflow errors

# Profile for linting with release mode-like settings.
# Catches lint errors which only appear in release mode.
# `cargo lint --profile dev-no-debug-assertions` is about 35% faster than `cargo lint --release`.
[profile.dev-no-debug-assertions]
inherits = "dev"
debug-assertions = false

# Quick-to-build profile for callgrind (not used for timings).
[profile.prof]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
debug = true

# rav1d 1.1.0 on crates.io is missing `src/arm/asm-offsets.h` (its `exclude`
# list strips all `*.h`), so the aarch64 asm fails to build on Apple Silicon.
# Fixed upstream in 0ce8cc12 (unreleased 1.1.1). The git tag has the same code
# as the crates.io release, plus the header. Remove once 1.1.1+ is published.
[patch.crates-io]
rav1d = { git = "https://github.com/memorysafety/rav1d", tag = "v1.1.0" }
